<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo – AI Chat App UI Kit (Live Demo)</title>
<meta name="description" content="Live demo of Lumo, an AI chat app UI kit built with Flutter.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // Phones get the app full screen, no frame.
  if (window.matchMedia('(max-width: 600px)').matches) location.replace('app/');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0E12;
    --surface: #17191F;
    --border: #2A2E38;
    --text: #F2F3F5;
    --muted: #9AA0AC;
    --lime: #C8F45A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 60%, rgba(200, 244, 90, .10), transparent 70%);
    pointer-events: none;
  }
  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 0 0;
    height: 92px;
    flex-shrink: 0;
  }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--lime); position: relative; flex-shrink: 0; }
  .logo::before { content: ""; position: absolute; left: 12.5px; top: 12.5px; width: 15px; height: 15px; border: 2.5px solid var(--bg); border-radius: 50%; }
  .logo::after { content: ""; position: absolute; left: 23.75px; top: 11.25px; width: 5px; height: 5px; background: var(--bg); border-radius: 50%; }
  h1 { font-family: Sora, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -.4px; }
  h1 span { color: var(--muted); font-weight: 600; }
  .badge { font-size: 12px; font-weight: 600; color: var(--bg); background: var(--lime); border-radius: 999px; padding: 4px 10px; letter-spacing: .3px; }

  .stage { position: relative; flex: 1; width: 100%; display: flex; align-items: flex-start; justify-content: center; }
  .phone {
    width: 418px;
    height: 872px;
    padding: 14px;
    border-radius: 64px;
    background: linear-gradient(145deg, #2a2d35, #15171c);
    box-shadow: 0 0 0 2px #33363f, 0 0 0 4px #0a0b0e, 0 50px 100px rgba(0, 0, 0, .65);
    transform-origin: top center;
    position: relative;
  }
  .phone::before, .phone::after {
    content: "";
    position: absolute;
    left: -4px;
    width: 4px;
    border-radius: 2px 0 0 2px;
    background: #2a2d35;
  }
  .phone::before { top: 170px; height: 60px; }
  .phone::after { top: 250px; height: 60px; }
  .side-btn { position: absolute; right: -4px; top: 210px; width: 4px; height: 90px; border-radius: 0 2px 2px 0; background: #2a2d35; }
  .screen {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 50px;
    overflow: hidden;
    clip-path: inset(0 round 50px);
    isolation: isolate;
    background: var(--bg);
  }
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 47px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 32px 0 44px;
    font-family: -apple-system, 'SF Pro Text', 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    background: var(--bg);
    z-index: 2;
  }
  .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; }
  .icons { display: flex; align-items: center; gap: 6px; }
  iframe {
    position: absolute;
    top: 47px; left: 0;
    width: 390px;
    height: 797px;
    border: 0;
    display: block;
    background: var(--bg);
  }
  .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .85);
    z-index: 2;
    pointer-events: none;
  }
  .hint {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--muted);
    display: flex; gap: 16px; align-items: center;
    white-space: nowrap;
  }
  .hint button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .hint button:hover { border-color: var(--lime); }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true"></div>
    <h1>Lumo <span>· AI Chat App UI Kit</span></h1>
    <span class="badge">LIVE DEMO</span>
  </header>

  <main class="stage">
    <div class="phone" id="phone">
      <span class="side-btn"></span>
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="island"></span>
          <span class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3C13.3 1.5 10.8.4 8 .4S2.7 1.5.8 3.3L2 4.6c1.6-1.5 3.7-2.4 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3C11.4 4.7 9.8 4 8 4s-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zm0 3.6c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.6c-.4-.4-.9-.6-1.5-.6z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" opacity=".4"/></svg>
          </span>
        </div>
        <iframe id="app" src="app/" title="Lumo app demo"></iframe>
        <div class="home-indicator"></div>
      </div>
    </div>
  </main>

  <div class="hint">
    <span>Tap and scroll to explore 24 screens</span>
    <button type="button" onclick="document.getElementById('app').src = 'app/'">↻ Restart demo</button>
  </div>

<script>
  const phone = document.getElementById('phone');
  function fit() {
    const available = window.innerHeight - 92 - 70;
    const scale = Math.min(1, available / 872);
    phone.style.transform = `scale(${scale})`;
    phone.style.marginBottom = `${(scale - 1) * 872}px`;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
